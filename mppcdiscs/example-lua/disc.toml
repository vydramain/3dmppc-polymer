[disc]
id = "example-lua"
title = "mppcdisc example with lua"

[build]
sources = ["src/*.cpp"]

[scripts]
sources = ["scripts/*.lua"]

[assets]
# The scene is copied verbatim, as in example-cpp.
files = ["scenes/*.scene.toml"]

[textures]
files = ["assets/tex/*.png"]
format = "idx8"

[sounds]
files = ["assets/snd/*.wav"]

[models]
files = ["models/*.glb"]

[budget.pcca]
voice_count = 24
sound_memory_size = 524288

[budget.pccv]
screen_width = 320
screen_height = 240
texture_max_width = 256
texture_max_height = 256
video_memory_size = 1048576
frame_capacity = 4096
ot_bucket_count = 1024

[budget.pccg]
model_memory_size = 524288
triangle_capacity = 2048

[budget.pccio]
iport_count = 2

[budget.pccm]
card_slots = 16
card_slot_size = 8192

[budget.pccl]
# 256 KiB for the whole VM: LuaJIT's bootstrap (base, string, math and table
# libraries) plus this chunk and its state. The state holds the scene copied
# into plain tables - 9 meshes with 16 world numbers each, and 18 cam_NN keys -
# a few KiB at most.
script_memory_size = 262144
script_entry = "example-lua.luac"
