[disc]
id = "example-lua"
title = "mppcdisc example with lua"

[build]
sources = ["src/*.cpp"]

[scripts]
sources = ["scripts/*.lua"]

[assets]
# The scene is copied verbatim, as in example-cpp.
files = ["scenes/*.scene.toml"]

[textures]
# The pictures are inside the models; format is the format their textures are baked in.
files = []
format = "idx8"

[sounds]
files = ["assets/snd/*.wav"]

[models]
files = ["models/*.glb"]

[budget.pcca]
voice_count = 24
sound_memory_size = 524288

[budget.pccv]
screen_width = 320
screen_height = 240
texture_max_width = 256
texture_max_height = 256
video_memory_size = 1048576
frame_capacity = 4096
ot_bucket_count = 1024

[budget.pccg]
model_memory_size = 524288
# Worst frame: 2678 triangles (each model once, glb counts: factory 1348, street 642, house 244, apartment 164,
# machines 144, furniture 76, lamp 28, lamp_light 12, glyphs 16, board and halo 2 each) + 3 x 40 for the three
# extra lamp instances (lamp 28 and lit lamp_light 12) = 2798 <= 4096.
triangle_capacity = 4096

[budget.pccio]
iport_count = 2

[budget.pccm]
card_slots = 16
card_slot_size = 8192

[budget.pccl]
# 512 KiB for the whole VM. The state holds the scene copied into plain tables:
# the meshes, the cam_NN keys, the lamps and the board's world. The modules and
# the per-frame garbage of cdata (rv_cg_put, int64 returns) are left to the
# ordinary collector. Measured with the dev channel's status (lua_used, bytes, with the
# sound module): 262548 after disc_initialize, when the lamp schedule's garbage is not yet
# collected; 164803-300692 over the frames (min and max of 122 readings), as the collector
# runs; 222393 after a reload.
# 256 KiB (262144 bytes) was too little: the largest reading over the frames is 300692.
script_memory_size = 524288
script_entry = "example-lua.luac"
