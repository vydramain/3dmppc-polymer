[disc]
id = "example-lua"
title = "mppcdisc example with lua"

[build]
sources = ["src/*.cpp"]

[scripts]
sources = ["scripts/*.lua"]

[assets]
files = ["assets/*.txt"]

[textures]
files = ["assets/*.png"]
format = "idx8"

[budget.pcca]
voice_count = 24
sound_memory_size = 524288

[budget.pccv]
screen_width = 320
screen_height = 240
texture_max_width = 256
texture_max_height = 256
video_memory_size = 1048576
frame_capacity = 4096
ot_bucket_count = 1024

[budget.pccio]
iport_count = 2

[budget.pccm]
card_slots = 16
card_slot_size = 8192

[budget.pccl]
# 256 KiB. The whole script is one module table with a handful of tiny
# closures and a few numeric locals - LuaJIT's own bootstrap (the base,
# string, math and table libraries opened by rv_pccl) plus that module easily
# fit in a few tens of KiB. 262144 leaves comfortable headroom over what this
# example could ever allocate without reserving memory nobody here needs; same
# order of magnitude as [budget.pcca] sound_memory_size above, for the same
# reason - honest for what this disc actually does, not a guess at a "real"
# budget.
script_memory_size = 262144
script_entry = "example-lua.luac"
