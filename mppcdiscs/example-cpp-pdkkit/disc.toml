[disc]
id = "example-cpp-pdkkit"
title = "mppcdisc example: pdkkit"

[build]
sources = ["src/*.cpp"]
# Compiles against pdkkit: without the kit SDK tree, #include "pdkkit/..." is not found.
sdk = ["kit"]

[assets]
# A file is sorted by its extension: .wav is baked to .pcm; .gltf is baked to .mppcmod with its .bin
# and the PNG pictures it names (most in assets/tex, street_16's in assets/models); the rest (the scene) is copied as is.
# The disc reads the scene's objects through the drive (src/example-cpp-pdkkit.cpp).
files = ["scenes/*.scene.toml", "assets/snd/*.wav", "assets/models/*.gltf"]

[assets.texture]
# The format each PNG picture named by a .gltf is baked to; idx8 is the default.
format = "idx8"

[budget.pcca]
voice_count = 24
# The same 1 MiB Solid Maid declares (solid-maid/disc.toml [budget.pcca]); music slots, clack and loops fit in it.
sound_memory_size = 1048576

[budget.pccv]
screen_width = 320
screen_height = 240
texture_max_width = 256
texture_max_height = 256
video_memory_size = 1048576
frame_capacity = 4096
ot_bucket_count = 1024

[budget.pccg]
model_memory_size = 524288
# Worst frame: 2568 triangles (each model once, model counts: factory 1324, street_16 404, yard 140, house_7 260,
# apartment 160, machines 144, furniture 76, lamp 28, lamp_light 12, glyphs 16, board and halo 2 each) + 3 x 40
# for the three extra lamp instances (lamp 28 and lit lamp_light 12) = 2688 <= 4096.
triangle_capacity = 4096

[budget.pccio]
iport_count = 2

[budget.pccm]
card_slots = 16
card_slot_size = 8192

