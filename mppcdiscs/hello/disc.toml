# The smallest complete disc: a manifest, one source file, one texture.
#
# It exists to prove the whole path end to end — mppcburner compiles and burns
# this directory into one .mppcdisc, and the console mounts that file, loads the
# code out of it, and runs it without knowing this game's name. It is also the
# reference for what a disc directory looks like.

[disc]
id = "hello"
title = "hello - the smallest disc"
abi_version = 1

[build]
sources = ["src/*.cpp"]

[assets]
files = ["assets/*.txt"]

[textures]
files = ["assets/*.png"]
format = "idx8"
