[disc]
id = "example-cpp"
title = "mppcdisc example"

[build]
sources = ["src/*.cpp"]

[assets]
# The scene is copied verbatim: the disc reads its objects through the drive (src/example-cpp.cpp).
files = ["scenes/*.scene.toml"]

[textures]
# The pictures are inside the models; format is the format their textures are baked in.
files = []
format = "idx8"

[sounds]
files = ["assets/snd/*.wav"]

[models]
files = ["models/*.glb"]

[budget.pcca]
voice_count = 24
# The same 1 MiB Solid Maid declares (solid-maid/disc.toml [budget.pcca]); music slots, clack, loops and footsteps fit in it.
sound_memory_size = 1048576

[budget.pccv]
screen_width = 320
screen_height = 240
texture_max_width = 256
texture_max_height = 256
video_memory_size = 1048576
frame_capacity = 4096
ot_bucket_count = 1024

[budget.pccg]
model_memory_size = 524288
# Worst frame: 2682 triangles (each model once, glb counts: factory 1324, street 642, house 272, apartment 164,
# machines 144, furniture 76, lamp 28, lamp_light 12, glyphs 16, board and halo 2 each) + 3 x 40 for the three
# extra lamp instances (lamp 28 and lit lamp_light 12) = 2802 <= 4096.
triangle_capacity = 4096

[budget.pccio]
iport_count = 2

[budget.pccm]
card_slots = 16
card_slot_size = 8192

