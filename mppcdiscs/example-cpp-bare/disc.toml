[disc]
id = "example-cpp-bare"
title = "mppcdisc example: bare"

[build]
sources = ["src/*.cpp"]

[assets]
# The scene is copied verbatim, as in example-lua-bare. The disc does not read it: the manifest
# parser requires a non-empty [assets] (B-ASSETS, owner's decision).
files = ["scenes/*.scene.toml"]

[textures]
# The model pictures are separate PNG files in assets/tex, baked by the model build; this section
# holds no separate textures. format is the format the model pictures are baked in.
files = []
format = "idx8"

[sounds]
files = ["assets/snd/*.wav"]

[models]
# glTF models with their .bin buffers, baked to .mppcmod by the build; pictures are assets/tex/*.png.
files = ["assets/models/*.gltf"]

[budget.pcca]
voice_count = 24
# The same 1 MiB Solid Maid declares (solid-maid/disc.toml [budget.pcca]); music slots, clack, loops and footsteps fit in it.
sound_memory_size = 1048576

[budget.pccv]
screen_width = 320
screen_height = 240
texture_max_width = 256
texture_max_height = 256
video_memory_size = 1048576
frame_capacity = 4096
ot_bucket_count = 1024

[budget.pccg]
model_memory_size = 524288
# Worst frame: 2568 triangles (each model once, model counts: factory 1324, street_16 404, yard 140, house_7 260,
# apartment 160, machines 144, furniture 76, lamp 28, lamp_light 12, glyphs 16, board and halo 2 each) + 3 x 40
# for the three extra lamp instances (lamp 28 and lit lamp_light 12) = 2688 <= 4096.
triangle_capacity = 4096

[budget.pccio]
iport_count = 2

[budget.pccm]
card_slots = 16
card_slot_size = 8192
